<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="FreeSecureKit">
  <!--
    Matches the header mark: lucide's shield-check on the accent indigo
    rounded square. Drawn on a filled tile rather than as a bare glyph so it
    stays legible at 16px and reads on both light and dark browser chrome.
    Fill is rgb(79 70 229), the light theme accent colour.
    NB: no double hyphens in this comment; they are illegal inside XML
    comments and make the whole file fail to parse as an image.
  -->
  <rect width="32" height="32" rx="7" fill="#4F46E5" />
  <g
    transform="translate(4 4)"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2.25"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
    <path d="m9 12 2 2 4-4" />
  </g>
</svg>
