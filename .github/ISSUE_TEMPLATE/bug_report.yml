name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach a file containing anything private. A description of
        the file usually tells us more than the file does.

  - type: dropdown
    id: tool
    attributes:
      label: Which tool
      options: [PDF Tools, Spreadsheet Tools, Image Tools, Developer Tools, Something else]
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: The file, described
      description: Rough size, format, and anything unusual about it. No need to attach it.
      placeholder: 12 MB scanned PDF, 40 pages, password protected

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 128, Windows 11
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Anything red in the browser console, if you had it open.
      render: text
